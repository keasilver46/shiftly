services:
  postgres:
    image: postgres:16
    container_name: shiftly-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: shiftly
      POSTGRES_USER: shiftly
      POSTGRES_PASSWORD: shiftly
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
